name: Android Kotlin CI

on:
  pull_request:
    branches:
      - main
      - feat/native-android-build
    paths:
      - 'android-native/**'
      - 'server/**'
      - '.github/workflows/android-native-ci.yml'
  push:
    branches:
      - 'android/**'
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-kotlin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native-android:
    name: Build and test native Kotlin app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test server authentication and messaging
        run: node server/test.mjs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Compile, run unit tests, and assemble debug APK
        run: gradle -p android-native --no-daemon clean testDebugUnitTest assembleDebug

      - name: Upload native Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tege-native-kotlin-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
