name: Server security tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'package.json'
      - '.github/workflows/server-security-check.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'package.json'
      - '.github/workflows/server-security-check.yml'

jobs:
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run test:server
      - run: npm run build
