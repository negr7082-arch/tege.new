name: Build Android APK (Tege Messenger)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # The GitHub runner already ships the Android SDK; just make sure licenses are accepted.
      - name: Accept Android SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check (does not block the build)
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build web app
        run: npx vite build && node scripts/compat-css.mjs dist
        env:
          VITE_SERVER_URL: https://tege-new.onrender.com

      - name: Generate Android project (Capacitor)
        run: |
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" /><uses-permission android:name="android.permission.RECORD_AUDIO" /><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" /><uses-permission android:name="android.permission.VIBRATE" /><application|' "$M"
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tege-Messenger-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
