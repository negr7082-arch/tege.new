name: Build Native Android APK (Kotlin + Compose)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android-native/**"
      - ".github/workflows/native-android-apk.yml"
  push:
    branches: [main]
    paths:
      - "android-native/**"
      - ".github/workflows/native-android-apk.yml"

permissions:
  contents: read

concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native-apk:
    name: Compile native Compose app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under ANDROID_HOME=$ANDROID_HOME" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Compile debug APK
        working-directory: android-native
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload native debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Tege-Native-Debug-APK
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
