name: Native Telegram Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/telegram-tege-integration
    paths:
      - "third_party/Telegram/**"
      - ".github/workflows/telegram-native-apk.yml"

permissions:
  contents: read

jobs:
  telegram-native-apk:
    name: Compile native Telegram Android client
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK and native toolchains
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Make Gradle wrapper executable
        working-directory: third_party/Telegram
        run: chmod +x gradlew

      - name: Compile Telegram debug APK
        working-directory: third_party/Telegram
        run: |
          ./gradlew --no-daemon --stacktrace \
            -x processAfatDebugGoogleServices \
            :TMessagesProj_App:assembleAfatDebug

      - name: Upload Telegram APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Telegram-Native-Debug-APK
          path: third_party/Telegram/TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
          if-no-files-found: error
          retention-days: 14
