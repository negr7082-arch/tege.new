name: Native Telegram Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/telegram-tege-integration
    paths:
      - "third_party/Telegram/**"
      - ".github/workflows/telegram-native-apk.yml"

permissions:
  contents: read

jobs:
  telegram-native-apk:
    name: Compile native Telegram Android client
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository and Telegram submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK and native toolchains
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Make Gradle wrapper executable
        working-directory: third_party/Telegram
        run: chmod +x gradlew

      - name: Compile Telegram debug APK
        working-directory: third_party/Telegram
        run: |
          ./gradlew --no-daemon --stacktrace \
            -x processAfatDebugGoogleServices \
            :TMessagesProj_App:assembleAfatDebug

      - name: Upload Telegram APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Telegram-Native-Debug-APK
          path: third_party/Telegram/TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
          if-no-files-found: error
          retention-days: 14
